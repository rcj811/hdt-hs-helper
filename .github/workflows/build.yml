name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "建立 GitHub Release（版本號取自 csproj）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Fetch HDT reference assemblies (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-hdt-refs.ps1 -OutDir hdt-ref

      - name: Build plugin
        run: dotnet build src/HsHelper/HsHelper.csproj -c Release -o out

      - name: Version
        id: ver
        run: |
          $v = ([xml](Get-Content src/HsHelper/HsHelper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, built against $(Get-Content hdt-ref/hdt-version.txt)"

      - name: Get Traditional Chinese language file for Inno Setup
        run: |
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseTraditional.isl" -OutFile installer/ChineseTraditional.isl

      - name: Ensure Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer/HsHelper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: HsHelper-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/HsHelper-Setup-*.exe
            out/HsHelper.dll

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag (Get-Item installer/Output/HsHelper-Setup-*.exe).FullName out/HsHelper.dll --target "${{ github.sha }}" --title "爐石輔助 $tag" --notes "安裝檔：HsHelper-Setup-${{ steps.ver.outputs.version }}.exe（會自動偵測並安裝官方 HDT）。編譯時對應 HDT：$(Get-Content hdt-ref/hdt-version.txt)"
