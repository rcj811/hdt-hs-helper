name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HDT reference assemblies (official release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-hdt-refs.ps1 -OutDir hdt-ref

      - name: Build plugin
        run: dotnet build src/HsHelper/HsHelper.csproj -c Release -o out

      - name: Version
        id: ver
        run: |
          $v = ([xml](Get-Content src/HsHelper/HsHelper.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, built against $(Get-Content hdt-ref/hdt-version.txt)"

      - name: Get Traditional Chinese language file for Inno Setup
        run: |
          Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseTraditional.isl" -OutFile installer/ChineseTraditional.isl

      - name: Ensure Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer/HsHelper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HsHelper-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/HsHelper-Setup-*.exe
            out/HsHelper.dll

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer/Output/HsHelper-Setup-*.exe out/HsHelper.dll --title "${{ github.ref_name }}" --notes "爐石輔助 ${{ github.ref_name }}"
